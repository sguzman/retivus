name: Anki Rust backend feasibility
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anki-backend-spike.yml"
      - "spikes/anki-collection/**"
      - "spikes/anki-git/**"
      - "src/anki_backend.rs"
      - "src/study_ui.rs"
      - "src/main.rs"
      - "src/lib.rs"
      - "Cargo.toml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retivus-anki-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Retivus integration smoke client
        uses: actions/checkout@v4
      - name: Retrieve exact Anki revision
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          ref: 136bd42bfbd356fc756b6d3e28cc77b02da11ea7
          path: upstream-anki
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned upstream Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Inspect upstream workspace and license boundaries
        working-directory: upstream-anki
        run: |
          test "$(git rev-parse HEAD)" = 136bd42bfbd356fc756b6d3e28cc77b02da11ea7
          grep -q 'AGPL' LICENSE
          grep -q 'name = "anki"' rslib/Cargo.toml
          grep -q 'publish = false' rslib/Cargo.toml
          grep -q 'pub struct CollectionBuilder' rslib/src/collection/mod.rs
          cargo --version
      - name: Retrieve only required upstream translation submodules
        working-directory: upstream-anki
        run: |
          git submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
          test -d ftl/core-repo/core
          test -d ftl/qt-repo/desktop
      - name: Install upstream native codegen requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          command -v protoc
          protoc --version
      - name: Apply isolated Tokio io-util compatibility feature
        working-directory: upstream-anki
        run: |
          grep -Fq 'features = ["fs", "rt-multi-thread", "macros", "signal"]' Cargo.toml
          sed -i 's/features = \["fs", "rt-multi-thread", "macros", "signal"\]/features = ["fs", "io-util", "rt-multi-thread", "macros", "signal"]/' Cargo.toml
          grep -Fq 'features = ["fs", "io-util", "rt-multi-thread", "macros", "signal"]' Cargo.toml
          git diff -- Cargo.toml
      - name: Compile Anki Rust library from pinned workspace
        working-directory: upstream-anki
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
        run: |
          cargo check --locked -p anki
      - name: Verify a separate Retivus client against disposable Anki collection
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          cargo run --manifest-path spikes/anki-collection/Cargo.toml
      - name: Test clean pinned Cargo Git dependency without local Anki checkout
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          cargo run --manifest-path spikes/anki-git/Cargo.toml
      - name: Test optional Retivus Anki-backed library integration
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          cargo test --features anki-backend --lib
      - name: Compile and test feature-enabled native learner workspace
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          cargo check --features anki-backend --bin retivus
          cargo test --features anki-backend --bin retivus
      - name: Smoke feature-enabled native learner window under X11
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb xdotool scrot openbox libgl1-mesa-dri libxkbcommon-x11-0
          cargo build --features anki-backend --bin retivus
          xvfb-run -a bash -euo pipefail -c '
            openbox > /tmp/retivus-feature-wm.log 2>&1 &
            wm=$!
            LIBGL_ALWAYS_SOFTWARE=1 ./upstream-anki/target/debug/retivus > /tmp/retivus-feature.log 2>&1 &
            app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for attempt in $(seq 1 80); do
              window=$(xdotool search --onlyvisible --name "Retivus" | head -n 1 || true)
              if test -n "$window"; then
                xdotool windowactivate --sync "$window" || true
                xdotool windowsize "$window" 1080 800
                sleep 1
                scrot --window "$window" /tmp/retivus-feature-wide.png
                test "$(wc -c < /tmp/retivus-feature-wide.png)" -gt 8000
                xdotool key --clearmodifiers Tab
                xdotool key --clearmodifiers shift+Tab
                xdotool windowsize "$window" 720 650
                sleep 1
                scrot --window "$window" /tmp/retivus-feature-narrow.png
                test "$(wc -c < /tmp/retivus-feature-narrow.png)" -gt 8000
                kill -0 "$app"
                exit 0
              fi
              if ! kill -0 "$app" 2>/dev/null; then
                cat /tmp/retivus-feature.log
                exit 1
              fi
              sleep 0.5
            done
            cat /tmp/retivus-feature.log
            exit 1
          '
      - name: Archive feature-enabled native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retivus-anki-feature-window
          path: /tmp/retivus-feature-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke feature-enabled native learner window under Wayland
        env:
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: "1"
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
          WLR_RENDERER_ALLOW_SOFTWARE: "1"
          XDG_CURRENT_DESKTOP: sway
          XDG_SESSION_TYPE: wayland
          XDG_RUNTIME_DIR: ${{ runner.temp }}/retivus-wayland
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sway grim jq libegl1
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/retivus-sway.conf" <<'SWAY'
          output * resolution 1080x800
          default_border pixel 1
          xwayland disable
          SWAY
          sway -c "$RUNNER_TEMP/retivus-sway.conf" > /tmp/retivus-sway.log 2>&1 &
          sway_pid=$!
          app_pid=""
          trap 'test -z "$app_pid" || kill "$app_pid" 2>/dev/null || true; kill "$sway_pid" 2>/dev/null || true' EXIT
          unset WAYLAND_DISPLAY DISPLAY
          for attempt in $(seq 1 70); do
            for socket in "$XDG_RUNTIME_DIR"/wayland-*; do
              if test -S "$socket"; then
                export WAYLAND_DISPLAY="$(basename "$socket")"
                break 2
              fi
            done
            if ! kill -0 "$sway_pid" 2>/dev/null; then
              cat /tmp/retivus-sway.log
              exit 1
            fi
            sleep 0.25
          done
          test -n "${WAYLAND_DISPLAY:-}" || { cat /tmp/retivus-sway.log; exit 1; }
          for attempt in $(seq 1 40); do
            for socket in "$XDG_RUNTIME_DIR"/sway-ipc.*.sock; do
              if test -S "$socket"; then
                export SWAYSOCK="$socket"
                break 2
              fi
            done
            sleep 0.25
          done
          test -n "${SWAYSOCK:-}" || { cat /tmp/retivus-sway.log; exit 1; }
          swaymsg -t get_outputs
          ./upstream-anki/target/debug/retivus > /tmp/retivus-wayland-app.log 2>&1 &
          app_pid=$!
          opened=0
          for attempt in $(seq 1 80); do
            if swaymsg -t get_tree | jq -e '.. | objects | select(.name? == "Retivus")' >/dev/null; then
              opened=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/retivus-wayland-app.log
              exit 1
            fi
            sleep 0.25
          done
          test "$opened" -eq 1 || { cat /tmp/retivus-wayland-app.log; exit 1; }
          sleep 1
          grim -o HEADLESS-1 /tmp/retivus-wayland-wide.png
          test "$(wc -c < /tmp/retivus-wayland-wide.png)" -gt 8000
          swaymsg output HEADLESS-1 mode 720x650
          sleep 1
          grim -o HEADLESS-1 /tmp/retivus-wayland-narrow.png
          test "$(wc -c < /tmp/retivus-wayland-narrow.png)" -gt 8000
          kill -0 "$app_pid"
          # Seed only disposable debug-build study data. Exercise populated
          # reviewer and provenance-conflict screens under real Sway Wayland.
          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! swaymsg -t get_tree | jq -e '.. | objects | select(.name? == "Retivus")' >/dev/null; then
              break
            fi
            sleep 0.2
          done
          for scene in review conflict; do
            swaymsg output HEADLESS-1 mode 1080x800
            RETIVUS_VISUAL_QA=isolated-2026 RETIVUS_QA_SCENE="$scene" \
              ./upstream-anki/target/debug/retivus > "/tmp/retivus-wayland-$scene.log" 2>&1 &
            app_pid=$!
            found=0
            for attempt in $(seq 1 100); do
              if swaymsg -t get_tree | jq -e '.. | objects | select(.name? == "Retivus")' >/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat "/tmp/retivus-wayland-$scene.log"
                exit 1
              fi
              sleep 0.3
            done
            test "$found" -eq 1 || { cat "/tmp/retivus-wayland-$scene.log"; exit 1; }
            grep -q "Retivus disposable visual QA scene initialized: $scene" "/tmp/retivus-wayland-$scene.log"
            sleep 2
            grim -o HEADLESS-1 "/tmp/retivus-wayland-$scene-wide.png"
            test "$(wc -c < "/tmp/retivus-wayland-$scene-wide.png")" -gt 9000
            swaymsg output HEADLESS-1 mode 720x650
            sleep 2
            grim -o HEADLESS-1 "/tmp/retivus-wayland-$scene-narrow.png"
            test "$(wc -c < "/tmp/retivus-wayland-$scene-narrow.png")" -gt 7000
            kill -0 "$app_pid"
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            app_pid=""
          done
          test "$(sha256sum /tmp/retivus-wayland-review-wide.png | cut -d' ' -f1)" != \
               "$(sha256sum /tmp/retivus-wayland-conflict-wide.png | cut -d' ' -f1)"
      - name: Archive feature-enabled Wayland screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retivus-anki-wayland-window
          path: |
            /tmp/retivus-wayland-*.png
            /tmp/retivus-wayland-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate and self-verify reproducible Desktop GUI fixture
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          cargo run --features anki-backend --bin desktop-interop-fixture -- generate "$output_dir"
          test -s "$output_dir/retivus-desktop-interop.apkg"
          cargo run --features anki-backend --bin desktop-interop-fixture -- verify "$output_dir/retivus-desktop-interop.apkg"
      - name: Verify official Anki Desktop collection copy
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          set -euo pipefail
          test "$(git hash-object upstream-anki/rslib/tests/support/mediacheck.anki2)" = "5580db4ef5419c21e76d9f0d31cfe1bb87f88656"
          RETIVUS_UPSTREAM_ANKI2="$PWD/upstream-anki/rslib/tests/support/mediacheck.anki2" cargo test --features anki-backend --lib official_upstream_anki_collection_fixture -- --ignored
      - name: Verify independent public Anki packages
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "https://raw.githubusercontent.com/ankidroid/Anki-Android/210a8a2e30be1dc9b21dabb63ae39dc5c1b37963/AnkiDroid/src/androidTest/assets/update1.apkg" -o "$RUNNER_TEMP/retivus-ankidroid.apkg"
          test "$(git hash-object "$RUNNER_TEMP/retivus-ankidroid.apkg")" = "5a0643b673d44d7e362f3353792460fe5e9b1eca"
          curl --fail --location --silent --show-error --retry 3 "https://raw.githubusercontent.com/rhgg2/AnkiTemplate/49013896cabb62608b5c915bcd855bd5f6f419dc/Sample%20deck.apkg" -o "$RUNNER_TEMP/retivus-public-sample.apkg"
          test "$(git hash-object "$RUNNER_TEMP/retivus-public-sample.apkg")" = "efa7d43b142b626a5b8ca038bcbf0fe5659980b5"
          RETIVUS_ANKIDROID_APKG="$RUNNER_TEMP/retivus-ankidroid.apkg" RETIVUS_PUBLIC_SAMPLE_APKG="$RUNNER_TEMP/retivus-public-sample.apkg" cargo test --features anki-backend --lib independent_public_apkg_fixtures -- --ignored
