name: Anki Rust backend feasibility
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anki-backend-spike.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Retivus integration smoke client
        uses: actions/checkout@v4
      - name: Retrieve exact Anki revision
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          ref: 136bd42bfbd356fc756b6d3e28cc77b02da11ea7
          path: upstream-anki
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned upstream Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Inspect upstream workspace and license boundaries
        working-directory: upstream-anki
        run: |
          test "$(git rev-parse HEAD)" = 136bd42bfbd356fc756b6d3e28cc77b02da11ea7
          grep -q 'AGPL' LICENSE
          grep -q 'name = "anki"' rslib/Cargo.toml
          grep -q 'publish = false' rslib/Cargo.toml
          grep -q 'pub struct CollectionBuilder' rslib/src/collection/mod.rs
          cargo --version
      - name: Retrieve only required upstream translation submodules
        working-directory: upstream-anki
        run: |
          git submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
          test -d ftl/core-repo/core
          test -d ftl/qt-repo/desktop
      - name: Install upstream native codegen requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          command -v protoc
          protoc --version
      - name: Apply isolated Tokio io-util compatibility feature
        working-directory: upstream-anki
        run: |
          grep -Fq 'features = ["fs", "rt-multi-thread", "macros", "signal"]' Cargo.toml
          sed -i 's/features = \["fs", "rt-multi-thread", "macros", "signal"\]/features = ["fs", "io-util", "rt-multi-thread", "macros", "signal"]/' Cargo.toml
          grep -Fq 'features = ["fs", "io-util", "rt-multi-thread", "macros", "signal"]' Cargo.toml
          git diff -- Cargo.toml
      - name: Compile Anki Rust library from pinned workspace
        working-directory: upstream-anki
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
        run: |
          cargo check --locked -p anki
      - name: Verify a separate Retivus client against disposable Anki collection
        env:
          CARGO_BUILD_JOBS: "2"
          PROTOC: /usr/bin/protoc
          CARGO_TARGET_DIR: ${{ github.workspace }}/upstream-anki/target
        run: |
          cargo run --manifest-path spikes/anki-collection/Cargo.toml
