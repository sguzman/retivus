name: Rust foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: retivus-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check code
        run: cargo clippy --all-targets -- -D warnings
      - name: Test provider boundary
        run: cargo test --all-targets
      - name: Independent Japanese-to-Spanish provider acceptance
        run: |
          cargo run --bin import-generic -- tests/fixtures/independent-ja-es.tsv /tmp/retivus-ja-es.sqlite3 ja-es-v1 independent-ja-es 2026-11-01 ja es CC0-1.0 | tee /tmp/retivus-ja-es-result.txt
          grep -q 'Imported 3 entries and 3 senses from independent provider independent-ja-es' /tmp/retivus-ja-es-result.txt
      - name: Compile native UI
        run: cargo build --locked
      - name: Smoke-launch real egui window under virtual X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot libgl1-mesa-dri libxkbcommon-x11-0 openbox
          xvfb-run -a bash -euo pipefail -c '
            openbox > /tmp/retivus-wm.log 2>&1 &
            wm=$!
            LIBGL_ALWAYS_SOFTWARE=1 ./target/debug/retivus > /tmp/retivus-gui.log 2>&1 &
            app=$!
            trap "kill $app $wm 2>/dev/null || true" EXIT
            for attempt in $(seq 1 120); do
              window=$(xdotool search --onlyvisible --name "Retivus" | head -n 1 || true)
              if test -n "$window"; then
                xdotool windowactivate --sync "$window" || true
                for frame in $(seq 1 25); do
                  scrot --window "$window" /tmp/retivus-ui.png
                  if test -s /tmp/retivus-ui.png && test "$(wc -c < /tmp/retivus-ui.png)" -gt 8000; then
                    # Exercise native focus navigation and responsive layouts on
                    # an actual X11 window; never rely only on unit tests.
                    xdotool key --clearmodifiers Tab
                    xdotool key --clearmodifiers shift+Tab
                    xdotool windowsize "$window" 680 560
                    sleep 1
                    scrot --window "$window" /tmp/retivus-narrow.png
                    test -s /tmp/retivus-narrow.png
                    test "$(wc -c < /tmp/retivus-narrow.png)" -gt 8000
                    xdotool key --clearmodifiers Tab
                    xdotool key --clearmodifiers Return
                    xdotool windowsize "$window" 1100 760
                    sleep 1
                    scrot --window "$window" /tmp/retivus-wide.png
                    test -s /tmp/retivus-wide.png
                    test "$(wc -c < /tmp/retivus-wide.png)" -gt 8000
                    kill -0 "$app"
                    exit 0
                  fi
                  if ! kill -0 "$app" 2>/dev/null; then
                    cat /tmp/retivus-gui.log
                    exit 1
                  fi
                  sleep 1
                done
                echo "Retivus window mapped but never produced a nonblank captured frame" >&2
                cat /tmp/retivus-gui.log
                cat /tmp/retivus-wm.log
                exit 1
              fi
              if ! kill -0 "$app" 2>/dev/null; then
                cat /tmp/retivus-gui.log
                exit 1
              fi
              sleep 0.5
            done
            echo "Retivus X11 startup diagnostics:" >&2
            xwininfo -root -tree || true
            ps -ef | grep -E "retivus|openbox|Xvfb" | grep -v grep || true
            cat /tmp/retivus-gui.log
            cat /tmp/retivus-wm.log
            exit 1
          '
      - name: Archive actual GUI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retivus-xvfb-screenshot
          path: |
            /tmp/retivus-ui.png
            /tmp/retivus-narrow.png
            /tmp/retivus-wide.png
          if-no-files-found: ignore
          retention-days: 7
