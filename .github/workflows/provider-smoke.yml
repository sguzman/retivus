name: Verify published Mexilex provider contract
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "src/provider.rs"
      - "src/source_adapter.rs"
      - "src/source_store.rs"
      - "src/preview.rs"
      - "src/bin/check-source.rs"
      - "src/bin/import-source.rs"
      - "src/bin/benchmark-source.rs"
      - "src/bin/benchmark-catalog.rs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retivus-provider-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download immutable Mexilex v0.3.0 study package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/published data/study
          gh release download lex-v0.3.0 --repo sguzman/mexilex --dir data/published
          (
            cd data/published
            sha256sum --check SHA256SUMS
            tar -tzf mexilex-study-v0.3.0.tar.gz | grep -q 'study.jsonl'
            tar -xzf mexilex-study-v0.3.0.tar.gz -C ../study
          )
      - name: Validate source language, provenance and licensing
        run: |
          test -s data/study/CORPUS-LICENSE.md
          test -s data/study/upstream.sha256
          test -s data/study/release-manifest.json
          node -e 'const m=require("./data/study/release-manifest.json");if(m.format_version!==1||m.project!=="mexilex"||m.version!=="0.3.0"||m.lexical_language!=="es-MX"||m.definition_language!=="en"||!m.source_git_commit)process.exit(1)'
          test "$(wc -l < data/study/study.jsonl)" -eq 124444
      - name: Stream-validate all real study records with Retivus
        run: |
          cargo run --bin check-source -- data/study/study.jsonl | tee data/validation-result.txt
          grep -q 'Validated 124444 Mexilex entries' data/validation-result.txt
      - name: Benchmark full release through bounded native preview
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq time
          cargo build --bin benchmark-source
          /usr/bin/time -f '%M' -o data/preview-peak-rss-kib.txt \
            ./target/debug/benchmark-source data/study/study.jsonl \
            | tee data/preview-result.txt
          grep -q 'Validated 124444 records, retained 12 preview rows' data/preview-result.txt
          peak_kib="$(cat data/preview-peak-rss-kib.txt)"
          test "$peak_kib" -gt 0
          test "$peak_kib" -lt 524288
          echo "Bounded full-release preview peak RSS: ${peak_kib} KiB (< 512 MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Import entire verified snapshot atomically within memory budget
        run: |
          set -euo pipefail
          cargo build --bin import-source
          /usr/bin/time -f '%M' -o data/catalog-peak-rss-kib.txt \
            ./target/debug/import-source data/study/study.jsonl data/catalog.sqlite3 lex-v0.3.0 \
            | tee data/import-result.txt
          grep -q 'Imported 124444 Mexilex entries' data/import-result.txt
          test -s data/catalog.sqlite3
          peak_kib="$(cat data/catalog-peak-rss-kib.txt)"
          test "$peak_kib" -gt 0
          test "$peak_kib" -lt 524288
          echo "Full-release SQLite catalog import peak RSS: ${peak_kib} KiB (< 512 MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark indexed source lookup after full catalog import
        run: |
          set -euo pipefail
          cargo build --bin benchmark-catalog
          /usr/bin/time -f '%M' -o data/lookup-peak-rss-kib.txt \
            ./target/debug/benchmark-catalog data/catalog.sqlite3 \
            | tee data/lookup-result.txt
          grep -q 'Performed 1000 indexed source catalog lookups' data/lookup-result.txt
          peak_kib="$(cat data/lookup-peak-rss-kib.txt)"
          test "$peak_kib" -gt 0
          test "$peak_kib" -lt 524288
          echo "1000 indexed source lookups peak RSS: ${peak_kib} KiB (< 512 MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Report independent consumer evidence
        run: |
          echo '## Mexilex published source integration' >> "$GITHUB_STEP_SUMMARY"
          cat data/validation-result.txt >> "$GITHUB_STEP_SUMMARY"
          cat data/import-result.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified upstream release SHA256SUMS, license notice, source identity, and language pair. No user decks or review history accessed.' >> "$GITHUB_STEP_SUMMARY"
