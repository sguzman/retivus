name: Locked Cargo source bundle audit
on:
  push:
    paths:
      - rust-toolchain.toml
      - scripts/audit-offline-source.sh
      - scripts/audit-license-files.sh
      - scripts/audit-parent-notices.sh
      - scripts/audit-linux-notices.sh
      - .github/workflows/source-bundle-audit.yml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: retivus-source-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact upstream Anki protobuf source
        uses: actions/checkout@v4
        with:
          repository: ankitects/anki
          ref: 136bd42bfbd356fc756b6d3e28cc77b02da11ea7
          path: upstream-anki
          persist-credentials: false
      - name: Resolve exact Anki translation Gitlink revisions
        run: git -C upstream-anki submodule update --init --depth 1 -- ftl/core-repo ftl/qt-repo
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Verify audit script shell syntax
        run: |
          bash -n scripts/audit-offline-source.sh
          bash -n scripts/audit-license-files.sh
          bash -n scripts/audit-parent-notices.sh
          bash -n scripts/audit-linux-notices.sh
      - name: Vendor all locked Cargo sources and verify offline dependency graph
        run: bash scripts/audit-offline-source.sh "$RUNNER_TEMP/retivus-source-audit"
      - name: Build checksummed source-distribution candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/retivus-source-audit"
          archive="$root/retivus-source-$GITHUB_SHA.tar.zst"
          test -s "$root/source/.cargo/config.toml"
          grep -Fx "Root commit: $GITHUB_SHA" "$root/SOURCE-AUDIT.txt"
          grep -Fx "Offline Cargo metadata: PASS" "$root/SOURCE-AUDIT.txt"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -C "$root" -cf - source | zstd -T1 -9 -o "$archive"
          (cd "$root" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          tar --zstd -tf "$archive" > "$root/archive-index.txt"
          grep -Fx 'source/Cargo.lock' "$root/archive-index.txt"
          test -n "$(grep -E '^source/proto/anki/[^/]+\.proto$' "$root/archive-index.txt" | head -n 1)"
          grep -Fx 'source/vendor/.version' "$root/archive-index.txt"
          test -n "$(grep -E '^source/ftl/core/[^/]+\.ftl$' "$root/archive-index.txt" | head -n 1)"
          test -n "$(grep -E '^source/ftl/qt/[^/]+\.ftl$' "$root/archive-index.txt" | head -n 1)"
          grep -Fx 'source/THIRD-PARTY-SOURCES.tsv' "$root/archive-index.txt"
          grep -Fx 'source/LICENSE-FILE-AUDIT.tsv' "$root/archive-index.txt"
          grep -Fx 'source/PARENT-NOTICE-REVIEW.tsv' "$root/archive-index.txt"
          grep -Fx 'source/LINUX-TARGET-DEPENDENCIES.tsv' "$root/archive-index.txt"
          grep -Fx 'source/LINUX-TARGET-NOTICE-REVIEW.tsv' "$root/archive-index.txt"
          grep -Fx 'source/docs/release-notice-exceptions.md' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/dispatch-0.2.0/AUTHOR-COMPANION-MIT.txt' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/dispatch-0.2.0/COMPANION-PROVENANCE.md' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/hexf-parse-0.2.1/CC0-1.0-SPDX.txt' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/hexf-parse-0.2.1/DEBIAN-PACKAGING-ATTRIBUTION.md' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/htmlescape-0.3.1/DEBIAN-PACKAGING-ATTRIBUTION.md' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/intl_pluralrules-7.0.2/LICENSE-MIT' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/intl_pluralrules-7.0.2/LICENSE-APACHE' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/difflib-0.4.0/LICENSE' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/EXTRA-NOTICE-EVIDENCE.tsv' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/egui-0.33.3/LICENSE-MIT' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/egui-0.33.3/LICENSE-APACHE' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/ANKI-PINNED-LICENSE.txt' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/ANKI-PINNED-CONTRIBUTORS.txt' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/objc2/LICENSE.txt' "$root/archive-index.txt"
          grep -Fx 'source/LICENSES/upstream/objc2/LICENSE.md' "$root/archive-index.txt"
          for notice in LICENSE-MIT LICENSE-APACHE AUTHORS LICENSE.chromium; do
            grep -Fx "source/LICENSES/upstream/accesskit/$notice" "$root/archive-index.txt"
          done
          for notice in LICENSE-MIT LICENSE-APACHE AUTHORS COPYRIGHT.md; do
            grep -Fx "source/LICENSES/upstream/rust-unic-0.9.0/$notice" "$root/archive-index.txt"
          done
          grep -Fx 'source/.cargo/config.toml' "$root/archive-index.txt"
          grep -Fx 'source/vendor/anki-0.0.0/Cargo.toml' "$root/archive-index.txt"
          grep -Fx 'source/vendor/percent-encoding-iri-2.2.0/Cargo.toml' "$root/archive-index.txt"
          (cd "$root" && sha256sum --check "$(basename "$archive").sha256")
      - name: Retain audited source, checksum and third-party inventory
        uses: actions/upload-artifact@v4
        with:
          name: retivus-locked-source-audit
          compression-level: 0
          path: |
            ${{ runner.temp }}/retivus-source-audit/retivus-source-*.tar.zst
            ${{ runner.temp }}/retivus-source-audit/retivus-source-*.tar.zst.sha256
            ${{ runner.temp }}/retivus-source-audit/THIRD-PARTY-SOURCES.tsv
            ${{ runner.temp }}/retivus-source-audit/LICENSE-FILE-AUDIT.tsv
            ${{ runner.temp }}/retivus-source-audit/PARENT-NOTICE-REVIEW.tsv
            ${{ runner.temp }}/retivus-source-audit/LINUX-TARGET-DEPENDENCIES.tsv
            ${{ runner.temp }}/retivus-source-audit/LINUX-TARGET-NOTICE-REVIEW.tsv
            ${{ runner.temp }}/retivus-source-audit/SOURCE-AUDIT.txt
          if-no-files-found: error
          retention-days: 30


  offline-rebuild:
    # Compile the actual archived source on an independent hosted VM.
    # This runner never checks out Retivus and uses a fresh Cargo home.
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download the audited source bundle from its producing job
        uses: actions/download-artifact@v4
        with:
          name: retivus-locked-source-audit
          path: ${{ runner.temp }}/retivus-offline-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install local native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler zstd pkg-config
      - name: Compile Anki-enabled Retivus from vendored source with no Cargo network
        shell: bash
        env:
          CARGO_NET_OFFLINE: 'true'
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
          PROTOC: /usr/bin/protoc
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/retivus-offline-evidence"
          source_archive="$evidence/retivus-source-$GITHUB_SHA.tar.zst"
          test -s "$source_archive"
          (cd "$evidence" && sha256sum --check "$(basename "$source_archive").sha256")
          grep -Fx "Root commit: $GITHUB_SHA" "$evidence/SOURCE-AUDIT.txt"
          grep -Fx 'Offline Cargo metadata: PASS' "$evidence/SOURCE-AUDIT.txt"
          root="$RUNNER_TEMP/retivus-independent-source-rebuild"
          mkdir -m 700 "$root"
          tar --zstd -xf "$source_archive" -C "$root"
          test -s "$root/source/.cargo/config.toml"
          test -s "$root/source/vendor/.version"
          test -s "$root/source/vendor/anki-0.0.0/Cargo.toml"
          test -s "$root/source/Cargo.lock"
          grep -Fx 'channel = "1.99.1"' "$root/source/rust-toolchain.toml"
          cargo_home="$RUNNER_TEMP/retivus-empty-cargo-home"
          mkdir -m 700 "$cargo_home"
          export CARGO_HOME="$cargo_home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/retivus-offline-build-target"
          (
            cd "$root/source"
            # No registry or Git fetches. This does not establish
            # bit-for-bit reproducibility or legal release clearance.
            cargo build --locked --offline --features anki-backend --bin retivus
          )
          test -x "$CARGO_TARGET_DIR/debug/retivus"
          printf 'Source archive: %s\n' "$(basename "$source_archive")"
          printf 'Independent offline Cargo build: PASS\n'
          sha256sum "$CARGO_TARGET_DIR/debug/retivus"
