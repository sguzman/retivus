name: Pin audited Cargo dependency lock
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pin-cargo-lock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconstruct and verify lockfile from accepted Linux candidate
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo 'e062551fb2452c43fe3e8c8bfe2c17150ad3ea4847cbb0d8a98110eee9e00f13  Cargo.lock' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: pin verified release-candidate Cargo.lock'
            git push origin HEAD:main
          fi
