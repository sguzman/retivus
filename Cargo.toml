[package]
name = "retivus"
version = "0.1.0"
edition = "2021"
description = "Rust/egui spaced repetition with Anki ecosystem and external data provider support"
license = "AGPL-3.0-or-later"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
