[package]
name = "retivus"
default-run = "retivus"
version = "0.1.0"
edition = "2021"
description = "Rust/egui spaced repetition with Anki ecosystem and external data provider support"
license = "AGPL-3.0-or-later"

[features]
default = []
anki-backend = ["dep:anki", "dep:reqwest", "dep:sha1", "dep:tokio", "dep:tempfile", "dep:zip", "dep:zstd"]

[dependencies]
anki = { git = "https://github.com/ankitects/anki", rev = "136bd42bfbd356fc756b6d3e28cc77b02da11ea7", optional = true }
# Ensures Anki's async I/O feature requirements resolve via Cargo feature unification.
tokio = { version = "1.51.6", features = ["io-util"], optional = true }
# Read-only AnkiWeb status adapter reuses the pinned backend's locked HTTP client.
reqwest = { version = "0.12.28", default-features = false, optional = true }
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde_json = "1"
rusqlite = { version = "0.36.0", features = ["bundled"] }
# Match Anki media-index SHA-1 checksums without mutating its sync database.
sha1 = { version = "=0.10.7", optional = true }
ttf-parser = "0.25"
tempfile = { version = "3", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate", "time"], optional = true }
zstd = { version = "0.14.3", optional = true }

[[bin]]
name = "desktop-interop-fixture"
path = "src/bin/desktop-interop-fixture.rs"
required-features = ["anki-backend"]

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.33.3", default-features = false, features = ["eframe", "x11"] }
